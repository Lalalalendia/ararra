name: ReadEra Google Drive owner credential security
on:
  push:
    paths:
      - 'src/chaptera_server/drive_oauth_setup.py'
      - 'src/chaptera_server/drive_acceptance.py'
      - 'src/chaptera_server/cli.py'
      - 'tests/test_drive_oauth_setup.py'
      - 'tests/test_drive_export.py'
      - 'scripts/connect-google-drive.ps1'
      - '.github/workflows/drive-windows-credential.yml'
  pull_request:
    paths:
      - 'src/chaptera_server/drive_oauth_setup.py'
      - 'src/chaptera_server/drive_acceptance.py'
      - 'src/chaptera_server/cli.py'
      - 'tests/test_drive_oauth_setup.py'
      - 'tests/test_drive_export.py'
      - 'scripts/connect-google-drive.ps1'
      - '.github/workflows/drive-windows-credential.yml'
jobs:
  oauth-windows:
    name: Windows Drive OAuth and SQLite acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ReadEra and isolated test runner
        run: python -m pip install -e . pytest
      - name: Exercise localhost consent and actual Windows owner ACL
        run: python -m pytest -q tests/test_drive_oauth_setup.py
      - name: Prove temporary SQLite handles close on Windows
        run: python -m pytest -q tests/test_drive_export.py -k drive_acceptance
      - name: Verify Windows bootstrap script parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/connect-google-drive.ps1), [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "Drive bootstrap PowerShell parse errors" }
