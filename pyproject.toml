[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptera-server-translator"
version = "0.6.2"
description = "Independent team translation backend based on the Chaptera translation algorithms"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.11",
    "python-multipart>=0.0.12,<1",
    "argon2-cffi>=23.1,<26",
    "cryptography>=42,<49",
    "jinja2>=3.1,<4",
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "httpcore>=1.0,<2",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
chaptera-server = "chaptera_server.cli:main"
chaptera-eval = "chaptera_server.eval_pilot:main"
chaptera-smoke = "chaptera_server.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chaptera_translation_core*", "chaptera_server*"]

[tool.setuptools.package-data]
chaptera_translation_core = ["py.typed"]
chaptera_server = [
    "web_ui/templates/*.html",
    "web_ui/templates/partials/*.html",
    "web_ui/static/css/*.css",
    "web_ui/static/js/*.mjs",
    "web_ui/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
