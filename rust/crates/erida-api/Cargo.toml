[package]
name = "erida-api"
version = "0.1.0"
default-run = "erida-api"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
erida-auth = { path = "../erida-auth" }
erida-store = { path = "../erida-store" }
erida-library = { path = "../erida-library" }
axum = { version = "0.8", features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1.47", features = ["rt", "macros", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.18", features = ["v4"] }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
