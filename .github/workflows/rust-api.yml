name: Rust API migration parity
on:
  push:
    # Avoid duplicate heavy Rust parity runs for the same PR commit.
    # Feature branches are validated by pull_request, main by push.
    branches: [main]
    paths:
      - 'rust/**'
      # erida-api/build.rs embeds the canonical UI at compile time.
      - 'src/chaptera_server/web_ui/**'
      - 'scripts/compare_rust_*.py'
      - 'scripts/rust_contract_inventory.py'
      - 'tests/test_rust_contract_inventory.py'
      - 'tests/test_architecture.py'
      - 'src/chaptera_server/api.py'
      - 'src/chaptera_server/http/**'
      - 'src/chaptera_server/storage.py'
      - 'src/chaptera_server/library.py'
      - 'src/chaptera_server/team_*.py'
      - 'src/chaptera_translation_core/core/**'
      - 'src/chaptera_translation_core/utils/source_units.py'
      - '.github/workflows/rust-api.yml'
  pull_request:
    paths:
      - 'rust/**'
      # erida-api/build.rs embeds the canonical UI at compile time.
      - 'src/chaptera_server/web_ui/**'
      - 'scripts/compare_rust_*.py'
      - 'scripts/rust_contract_inventory.py'
      - 'tests/test_rust_contract_inventory.py'
      - 'tests/test_architecture.py'
      - 'src/chaptera_server/api.py'
      - 'src/chaptera_server/http/**'
      - 'src/chaptera_server/storage.py'
      - 'src/chaptera_server/library.py'
      - 'src/chaptera_server/team_*.py'
      - 'src/chaptera_translation_core/core/**'
      - 'src/chaptera_translation_core/utils/source_units.py'
      - '.github/workflows/rust-api.yml'

permissions:
  contents: read

# Cancel obsolete branch runs; never cancel main acceptance.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-readonly-parity:
    name: Rust modules and Python API parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Check Rust lints
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Build release-mode loopback candidate and offline source probes
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p erida-api
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-policy --bin source-policy-probe
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-dom --bin source-dom-probe
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-clean --bin source-clean-probe
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-clean --bin source-inline-probe
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-clean --bin source-import-probe
      - name: Install Python reference API in disposable runner
        run: python -m pip install -e .
      - name: Inventory Python contracts and guarded Rust candidate routes
        run: |
          python scripts/rust_contract_inventory.py --check --json "$RUNNER_TEMP/erida-rust-m0.json"
          # Full contract tests run in the separate Python 3.11/3.12 matrix.
          # Do not install pytest just for the Rust parity workflow.
      - name: Upload M0 method and path gap report
        uses: actions/upload-artifact@v4
        with:
          name: erida-rust-m0-contract-inventory
          path: ${{ runner.temp }}/erida-rust-m0.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare auth/jobs semantics and sample idle memory
        run: python scripts/compare_rust_api.py rust/target/release/erida-api
      - name: Verify disposable cross-runtime SQLite job writes and CSRF
        run: python scripts/compare_rust_writes.py rust/target/release/erida-api
      - name: Verify book directory and owner CAS against live Python contract
        run: python scripts/compare_rust_books.py rust/target/release/erida-api
      - name: Verify glossary CAS, Unicode SQLite packing and actor audit against Python
        run: python scripts/compare_rust_glossary.py rust/target/release/erida-api
      - name: Diff standalone Rust source policy against Python source_units
        run: python scripts/compare_rust_source_policy.py rust/target/release/source-policy-probe
      - name: Diff Rust HTML DOM visible-node order against BeautifulSoup
        run: python scripts/compare_rust_source_dom.py rust/target/release/source-dom-probe
      - name: Verify text-node DOM paths against Python source unit ordinals
        run: python scripts/compare_rust_dom_paths.py rust/target/release/source-dom-probe
      - name: Verify Rust plain paragraph cleaning and SHA-256 against Python
        run: python scripts/compare_rust_source_clean.py rust/target/release/source-clean-probe
      - name: Verify bounded nested inline paragraph cleaning against Python
        run: python scripts/compare_rust_inline_clean.py rust/target/release/source-inline-probe
      - name: Verify short source cleaning through Rust SQLite writer and Python
        run: python scripts/compare_rust_clean_writer.py rust/target/release/erida-api
      - name: Verify nested inline chapter writes in shared SQLite and Python
        run: python scripts/compare_rust_inline_writer.py rust/target/release/erida-api
      - name: Verify conservative chapter writes against Python source policy and CAS
        run: python scripts/compare_rust_chapter_writes.py rust/target/release/erida-api
      - name: Verify accepted translation CAS, immutable revisions and Python parity
        run: python scripts/compare_rust_acceptance.py rust/target/release/erida-api
      - name: Verify editorial draft CAS, explicit rebase and audit against Python
        run: python scripts/compare_rust_editor_drafts.py rust/target/release/erida-api

      - name: Verify accepted history, cross-runtime restoration and stale-source fencing
        run: python scripts/compare_rust_accepted_history.py rust/target/release/erida-api
      - name: Verify cross-runtime editorial notes, CAS and security on disposable SQLite
        run: python scripts/compare_rust_review_notes.py rust/target/release/erida-api

      - name: Verify composite book flow and Python export boundary, with fail-closed manifest
        run: python scripts/compare_rust_book_vertical.py rust/target/release/erida-api

      - name: Compare native Rust accepted-book preview and TXT/HTML export with Python
        run: python scripts/compare_rust_book_export.py rust/target/release/erida-api

      - name: Verify Rust browser login, logout, CSRF and shared Python throttle
        run: python scripts/compare_rust_browser_sessions.py rust/target/release/erida-api
      - name: Verify Rust admin key issue rotate disable, owner handoff and job cancellation
        run: python scripts/compare_rust_admin_credentials.py rust/target/release/erida-api
      - name: Verify Rust-only cookie browser API book journey without Python HTTP
        run: python scripts/verify_rust_native_cookie_book_e2e.py rust/target/release/erida-api
      - name: Verify strict loopback proxy identity and shared Python Rust 429 lockout
        run: python scripts/compare_rust_proxy_login_ip.py rust/target/release/erida-api

      - name: Verify canonical TXT import HTML cleaning and SHA256 against Python
        run: python scripts/compare_rust_import_hash.py rust/target/release/source-import-probe
      - name: Compare Rust read-only TXT import preview with Python and ensure no SQLite writes
        run: python scripts/compare_rust_import_preview.py rust/target/release/erida-api

      - name: Compare Rust import stages against Python with idempotency, TTL, actor isolation and restart
        run: python scripts/compare_rust_import_stages.py rust/target/release/erida-api
      - name: Compare atomic Rust TXT import confirmation, source hashes and SQL rollback with Python
        run: python scripts/compare_rust_import_confirm.py rust/target/release/erida-api
      - name: Compare preserved import prefaces with Python and assert read-only team access
        run: python scripts/compare_rust_import_prefixes.py rust/target/release/erida-api
