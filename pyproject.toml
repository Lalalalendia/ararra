[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptera-server-translator"
version = "0.5.0"
description = "Independent team translation backend based on the Chaptera translation algorithms"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.11",
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
chaptera-server = "chaptera_server.cli:main"
chaptera-eval = "chaptera_server.eval_pilot:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chaptera_translation_core*", "chaptera_server*"]

[tool.setuptools.package-data]
chaptera_translation_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
