name: Rust API migration parity
on:
  push:
    paths:
      - 'rust/**'
      - 'scripts/compare_rust_api.py'
      - '.github/workflows/rust-api.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'scripts/compare_rust_api.py'
      - '.github/workflows/rust-api.yml'

permissions:
  contents: read

jobs:
  rust-readonly-parity:
    name: Rust modules and Python API parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Check Rust lints
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Build release-mode loopback candidate and offline source policy oracle
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p erida-api
          cargo build --release --manifest-path rust/Cargo.toml -p erida-source-policy --bin source-policy-probe
      - name: Install Python reference API in disposable runner
        run: python -m pip install -e .
      - name: Compare auth/jobs semantics and sample idle memory
        run: python scripts/compare_rust_api.py rust/target/release/erida-api
      - name: Verify disposable cross-runtime SQLite job writes and CSRF
        run: python scripts/compare_rust_writes.py rust/target/release/erida-api
      - name: Verify book directory and owner CAS against live Python contract
        run: python scripts/compare_rust_books.py rust/target/release/erida-api
      - name: Diff standalone Rust source policy against Python source_units
        run: python scripts/compare_rust_source_policy.py rust/target/release/source-policy-probe
      - name: Verify conservative chapter writes against Python source policy and CAS
        run: python scripts/compare_rust_chapter_writes.py rust/target/release/erida-api
      - name: Verify accepted translation CAS, immutable revisions and Python parity
        run: python scripts/compare_rust_acceptance.py rust/target/release/erida-api
