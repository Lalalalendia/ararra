name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: python tools/check_architecture.py
      - run: pytest -q
      - run: chaptera-smoke --transport html_v0
      - run: chaptera-smoke --transport atoms_v1

  web:
    name: Web boundaries and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web architecture without npm dependencies
        working-directory: web
        run: node --test scripts/architecture.test.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle web app
        working-directory: web
        run: npm run build
